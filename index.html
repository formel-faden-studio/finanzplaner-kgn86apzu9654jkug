<style>
:root{--serif:"Cormorant Garamond","Palatino Linotype","Book Antiqua",Palatino,Georgia,"Times New Roman",serif;--sage:#5E6B5B;--sage-l:#AEB9A6;--grey:#7A7A7A;--cream:#F5F3EE;--ink:#2E342C;--line:#E3DFD5;--sage-xl:#EAEEE6;--neg:#9B4A3C;--card:#fff;--r:14px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;line-height:1.25;font-family:var(--serif)}
h1{font-size:1.9rem;letter-spacing:.005em}h2{font-size:1.3rem}h3{font-size:1.12rem}
a{color:var(--sage)}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}
:focus-visible{outline:3px solid #8fa085;outline-offset:2px}

/* Kopfbereich */
.hdr{background:var(--sage);color:var(--cream)}
.hdr .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:14px 28px;padding-top:14px;padding-bottom:14px}
.brand{display:flex;align-items:center;gap:14px;min-height:80px;text-decoration:none;color:inherit}
.brand img.logo{height:80px;width:auto;max-width:340px;object-fit:contain;display:block}
.brand .bname{font-size:1.35rem;font-weight:700;letter-spacing:.01em;line-height:1.1}
.brand .tag{font-size:.8rem;opacity:.85;letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.nav{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.nav a{color:var(--cream);text-decoration:none;padding:10px 16px;border-radius:999px;font-weight:600;border:1px solid rgba(245,243,238,.35);white-space:nowrap}
.nav a .n{opacity:.7;margin-right:8px;font-variant-numeric:tabular-nums}
.nav a:hover{background:rgba(245,243,238,.12)}
.nav a.on{background:var(--cream);color:var(--sage);border-color:var(--cream)}
.nav a.on .n{opacity:.8}
.hdr .bk{background:transparent;border:1px solid rgba(245,243,238,.35);color:var(--cream);border-radius:999px;padding:10px 16px;font-weight:600;cursor:pointer}
.hdr .bk:hover{background:rgba(245,243,238,.12)}

main{padding:26px 0 40px}
.pagehead{margin-bottom:18px}
.pagehead p{margin:4px 0 0;color:var(--grey)}
.slogan{font-family:var(--serif);font-style:italic;font-size:1.3rem;color:var(--sage);margin-top:4px}

/* Kennzahlen-Kacheln – auf allen drei Seiten identisch */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;height:132px;overflow:hidden;display:flex;flex-direction:column;gap:3px;container-type:inline-size;border-top:4px solid var(--sage-l)}
.tile.k-income{border-top-color:var(--sage)}
.tile.k-exp{border-top-color:var(--grey)}
.tile.k-sav{border-top-color:var(--sage-l)}
.tile.k-room{border-top-color:#cfc8b6}
.tile .lbl{font-size:.78rem;color:var(--grey);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.tile .val{font-size:clamp(1.05rem,min(1.9rem,10.5cqi),1.9rem);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.2;margin:2px 0 2px}
.tile .val.neg,.neg{color:var(--neg)}
.tile .s1,.tile .s2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s1{font-size:.84rem;color:var(--ink)}
.tile .s2{font-size:.8rem;color:var(--grey)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card>h2,.cardhead{margin-bottom:12px}
.cardhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.cardhead .sum{font-size:.9rem;color:var(--grey);font-variant-numeric:tabular-nums}
.cardhead .sum b{color:var(--ink)}
.hint{font-size:.88rem;color:var(--grey);margin:0 0 10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:20px}
.gap{margin-top:20px}

/* Ausgaben-Hauptbereich */
.expenses{background:var(--sage-xl);border:1px solid var(--sage-l);border-radius:18px;padding:20px}
.expenses>.cardhead{margin-bottom:6px}
.expenses>.cardhead h2{font-size:1.3rem}
.expenses>.hint{margin-bottom:14px}

/* Positionen in der Jahresplanung */
.pos{border-top:1px solid var(--line);padding:12px 0}
.pos:first-of-type{border-top:0;padding-top:2px}
.pos-head{display:flex;gap:8px;align-items:center}
.pos-head .name{flex:1;font-weight:600}
.pos-year{font-size:.85rem;color:var(--grey);white-space:nowrap;font-variant-numeric:tabular-nums}
.pos-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px 10px;margin-top:8px}
.fld label,.fld .l{display:block;font-size:.72rem;color:var(--grey);margin-bottom:2px}
.row-v{display:grid;grid-template-columns:minmax(0,1fr) 140px auto 34px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.row-v:first-of-type{border-top:0}
.row-v .pos-year{min-width:96px;text-align:right}
.inp{width:100%;min-width:0;padding:8px 10px;border:1px solid #cdc7b8;border-radius:8px;background:#fff;height:40px}
.inp:hover{border-color:var(--sage-l)}
.inp:disabled{background:#f1efe9;color:#55594f;border-style:dashed}
.inp.num{text-align:right;padding-left:6px;padding-right:24px;font-variant-numeric:tabular-nums}
select.inp{padding-right:6px}
.mi{position:relative;display:block}
.cur{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--grey);pointer-events:none}
.icon-btn{width:34px;height:34px;flex:none;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--grey);cursor:pointer;font-size:1.1rem;line-height:1}
.icon-btn:hover{color:var(--neg);border-color:var(--neg)}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--sage);color:#fff}
.btn:hover{background:#4e5a4b}
.btn.sec{background:#fff;color:var(--sage);border:1px solid var(--sage-l)}
.btn.sec:hover{background:var(--sage-xl)}
.btn.add{background:transparent;color:var(--sage);border:1px dashed var(--sage-l);width:100%;margin-top:10px}
.btn.add:hover{background:var(--sage-xl)}
.btn.big{padding:15px 24px;font-size:1.08rem;border-radius:12px;min-width:220px;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.btn.warn{background:var(--neg)}
.lnk{background:none;border:0;color:var(--sage);cursor:pointer;font-size:.82rem;font-weight:600;padding:4px 2px;text-decoration:underline;white-space:nowrap}

/* Monatsübersicht */
.mhead-card{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;justify-content:space-between}
.mhead-card .left{min-width:0;flex:1 1 420px}
.mtitle{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.badge{display:inline-block;padding:4px 12px;border-radius:999px;font-size:.82rem;font-weight:700;border:1px solid var(--sage-l);color:var(--sage);background:var(--cream)}
.badge.done{background:var(--sage);color:#fff;border-color:var(--sage)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-width:52px;text-align:center;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;font-size:.9rem;font-weight:600}
.chip:hover{border-color:var(--sage-l)}
.chip.on{background:var(--sage);border-color:var(--sage);color:#fff}
.chip.done::after{content:" ✓";font-weight:700}
.closebox{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:0 0 auto}
.closebox .note{font-size:.82rem;color:var(--grey);max-width:260px;text-align:right}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 88px 152px 96px;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.mrow.h{border-top:0;font-size:.72rem;color:var(--grey);text-transform:uppercase;letter-spacing:.05em;padding-bottom:4px}
.mrow .pl{text-align:right;color:var(--grey);font-variant-numeric:tabular-nums;font-size:.92rem}
.mrow.h .pl,.mrow.h .ac{text-align:right}
.mrow .nm{min-width:0;overflow-wrap:anywhere}
.mrow.sub{border-top:0;padding-top:0;margin-top:-2px}
.mrow.sub .nm{font-size:.82rem;color:var(--grey);padding-left:14px}
.mark{font-size:.68rem;background:var(--sage-xl);color:var(--sage);border-radius:6px;padding:1px 6px;font-weight:700;white-space:nowrap;vertical-align:middle}
.mrow.tot{font-weight:700;border-top:2px solid var(--sage-l)}
.mrow.tot .pl{color:var(--ink)}
.mrow.tot .ac{text-align:right;font-variant-numeric:tabular-nums}
.ev{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ev th{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--grey);text-align:right;padding:6px 8px;font-weight:600}
.ev th:first-child,.ev td:first-child{text-align:left}
.ev td{padding:9px 8px;border-top:1px solid var(--line);text-align:right}
.ev tr.t td{font-weight:700;border-top:2px solid var(--sage-l)}
.note-open{background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:.9rem;margin-top:12px}

/* Dashboard */
.dash2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;margin-bottom:20px;align-items:stretch}
.areas{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.areas button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.85rem;font-weight:600}
.areas button.on{background:var(--sage);color:#fff;border-color:var(--sage)}
.gauge{display:block;width:100%;max-width:400px;margin:0 auto}
.gstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;margin-top:6px}
.gstats div{font-size:.88rem;color:var(--grey)}
.gstats b{display:block;color:var(--ink);font-size:1.02rem;font-variant-numeric:tabular-nums}
.good{color:#4b6a47}
.donutwrap{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:center}
.donut{width:200px;height:200px;flex:none}
.legend{list-style:none;margin:0;padding:0;flex:1 1 200px;min-width:0}

<body>
<noscript><p style="padding:24px;font-family:sans-serif">Der Finanzplaner benötigt aktiviertes JavaScript in Ihrem Browser.</p></noscript>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal"></div>
<script>
/* Finanzplaner 2027 – Kernlogik (reine Funktionen, alle Geldbeträge in ganzen Cent) */
var OFC = (function () {
  'use strict';

  var YEAR = 2027;
  var SCHEMA_VERSION = 1;
  var APP_ID = 'FormelFadenStudio-Finanzplaner-2027';
  var LEGACY_APP_IDS = ['OrdnungImKopfStudio-Finanzplaner-2027'];
  var MONTHS = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
  var RHYTHMS = [
    { key: 'monthly', label: 'monatlich', step: 1 },
    { key: 'quarterly', label: 'vierteljährlich', step: 3 },
    { key: 'halfyearly', label: 'halbjährlich', step: 6 },
    { key: 'yearly', label: 'jährlich', step: 12 },
    { key: 'once', label: 'einmalig', step: 0 }
  ];
  var SAVING_RHYTHMS = ['monthly', 'quarterly', 'yearly'];
  var MAX_CENTS = 9999999999; // 99.999.999,99 €

  function rhythmInfo(key) {
    for (var i = 0; i < RHYTHMS.length; i++) if (RHYTHMS[i].key === key) return RHYTHMS[i];
    return null;
  }

  var idCounter = 0;
  function makeId(prefix) {
    idCounter++;
    return (prefix || 'p') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8) + idCounter.toString(36);
  }

  /* ---------- Geldbeträge ---------- */

  // Deutsche Eingabe -> ganze Cent. Gibt null bei ungültiger Eingabe zurück. Leere Eingabe = 0.
  function parseMoney(input) {
    if (typeof input === 'number') {
      if (!isFinite(input)) return null;
      return Math.round(input * 100);
    }
    var s = String(input == null ? '' : input).replace(/[€\s ]/g, '');
    if (s === '') return 0;
    var neg = false;
    if (s.charAt(0) === '-' || s.charAt(0) === '−') { neg = true; s = s.slice(1); }
    if (s === '' || /[^0-9.,]/.test(s)) return null;
    var intPart, decPart = '';
    var lastComma = s.lastIndexOf(',');
    if (lastComma >= 0) {
      intPart = s.slice(0, lastComma);
      decPart = s.slice(lastComma + 1);
      if (intPart.indexOf(',') >= 0) return null;
      if (/\./.test(intPart)) {
        if (!/^\d{1,3}(\.\d{3})+$/.test(intPart)) return null;
        intPart = intPart.replace(/\./g, '');
      }
      if (decPart.indexOf('.') >= 0) return null;
    } else if (s.indexOf('.') >= 0) {
      if (/^\d{1,3}(\.\d{3})+$/.test(s)) { intPart = s.replace(/\./g, ''); }
      else if (/^\d*\.\d{1,2}$/.test(s)) { var p = s.split('.'); intPart = p[0]; decPart = p[1]; }
      else return null;
    } else {
      intPart = s;
    }
    if (intPart === '') intPart = '0';
    if (!/^\d+$/.test(intPart) || (decPart !== '' && !/^\d{1,2}$/.test(decPart))) return null;
    if (intPart.length > 9) return null;
    while (decPart.length < 2) decPart += '0';
    var cents = parseInt(intPart, 10) * 100 + parseInt(decPart, 10);
    if (cents > MAX_CENTS) return null;
    return neg ? -cents : cents;
  }

  function groupThousands(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }

  // Cent -> "1.234,56" (ohne Währungszeichen)
  function formatNumber(cents) {
    var neg = cents < 0;
    var a = Math.abs(cents);
    var eur = Math.floor(a / 100);
    var ct = a % 100;
    return (neg ? '−' : '') + groupThousands(eur) + ',' + (ct < 10 ? '0' : '') + ct;
  }
  function formatMoney(cents) { return formatNumber(cents) + ' €'; }
  function formatPercent(p) {
    var neg = p < 0;
    var a = Math.abs(p);
    var s = (Math.round(a * 100) / 100).toFixed(2).replace('.', ',');
    return (neg ? '−' : '') + s + ' %';
  }

  /* ---------- Zahlungsrhythmen ---------- */

  function clampMonth(m) {
    m = parseInt(m, 10);
    if (!(m >= 1 && m <= 12)) return 1;
    return m;
  }

  function paymentMonths(rhythm, startMonth) {
    var start = clampMonth(startMonth);
    var info = rhythmInfo(rhythm) || rhythmInfo('monthly');
    var res = [];
    if (info.step === 0) return [start];
    for (var m = start; m <= 12; m += info.step) res.push(m);
    return res;
  }

  function planForMonth(item, m) {
    return paymentMonths(item.rhythm, item.startMonth).indexOf(m) >= 0 ? item.amount : 0;
  }
  function planForYear(item) {
    return item.amount * paymentMonths(item.rhythm, item.startMonth).length;
  }

  /* ---------- Zustand ---------- */

  function item(prefix, name, extra) {
    var o = { id: makeId(prefix), name: name, amount: 0, rhythm: 'monthly', startMonth: 1 };
    if (extra) for (var k in extra) o[k] = extra[k];
    return o;
  }

  function emptyMonths() {
    var months = {};
    for (var m = 1; m <= 12; m++) months[m] = { closed: false, actual: {}, extras: [] };
    return months;
  }

  function defaultState() {
    return {
      schemaVersion: SCHEMA_VERSION,
      year: YEAR,
      incomes: [item('inc', 'Gehalt / Lohn / Einkommen'), item('inc', 'Weitere Einnahme 1'), item('inc', 'Weitere Einnahme 2')],
      fixed: [
        item('fix', 'Miete / Wohnen'), item('fix', 'Nebenkosten'), item('fix', 'Strom / Energie'),
        item('fix', 'Kfz-Steuer'), item('fix', 'Kfz-Versicherung'), item('fix', 'Weitere Versicherungen'),
        item('fix', 'Internet / Telefon'), item('fix', 'Abonnements'),
        item('fix', 'Rundfunkbeitrag', { rhythm: 'quarterly', startMonth: 1 }),
        item('fix', 'Kredite / Ratenzahlungen')
      ],
      variable: ['Lebensmittel', 'Drogerie / Haushalt', 'Kleidung', 'Freizeit', 'Bildung / Weiterbildung', 'Mobilität', 'Sonstiges']
        .map(function (n) { return item('var', n); }),
      savings: [
        item('sav', 'Langfristige Rücklagen'),
        item('sav', 'Notgroschen'),
        item('sav', 'Weiteres Sparziel')
      ],
      months: emptyMonths(),
      meta: { lastBackup: null, lastChange: null }
    };
  }

  function demoState() {
    var s = defaultState();
    function c(e) { return Math.round(e * 100); }
    function set(list, name, props) { var it = list.filter(function (x) { return x.name === name; })[0]; for (var k in props) it[k] = props[k]; return it; }
    set(s.incomes, 'Gehalt / Lohn / Einkommen', { amount: c(2850) });
    set(s.incomes, 'Weitere Einnahme 1', { name: 'Kindergeld', amount: c(250) });
    set(s.fixed, 'Miete / Wohnen', { amount: c(850) });
    set(s.fixed, 'Nebenkosten', { amount: c(220) });
    set(s.fixed, 'Strom / Energie', { amount: c(75) });
    set(s.fixed, 'Kfz-Steuer', { amount: c(120), rhythm: 'yearly', startMonth: 5 });
    set(s.fixed, 'Kfz-Versicherung', { amount: c(360), rhythm: 'yearly', startMonth: 3 });
    set(s.fixed, 'Weitere Versicherungen', { amount: c(45) });
    set(s.fixed, 'Internet / Telefon', { amount: c(39.99) });
    set(s.fixed, 'Abonnements', { amount: c(22.98) });
    set(s.fixed, 'Rundfunkbeitrag', { amount: c(55.08) });
    set(s.variable, 'Lebensmittel', { amount: c(380) });
    set(s.variable, 'Drogerie / Haushalt', { amount: c(50) });
    set(s.variable, 'Kleidung', { amount: c(60) });
    set(s.variable, 'Freizeit', { amount: c(120) });
    set(s.variable, 'Mobilität', { amount: c(90) });
    set(s.variable, 'Sonstiges', { amount: c(50) });
    var lang = set(s.savings, 'Langfristige Rücklagen', { amount: c(150) });
    var not = set(s.savings, 'Notgroschen', { amount: c(100) });
    set(s.savings, 'Weiteres Sparziel', { name: 'Urlaub', amount: c(50) });
    function v(name) { return s.variable.filter(function (x) { return x.name === name; })[0].id; }
    s.months[1].actual[v('Lebensmittel')] = c(412.40); s.months[1].actual[v('Freizeit')] = c(95);
    s.months[2].actual[v('Lebensmittel')] = c(365.10); s.months[2].actual[v('Sonstiges')] = c(80); s.months[2].actual[lang.id] = c(100);
    s.months[3].extras.push({ id: makeId('ext'), type: 'income', name: 'Steuerrückzahlung', amount: c(450) });
    s.months[3].extras.push({ id: makeId('ext'), type: 'expense', name: 'Neue Waschmaschine', amount: c(420) });
    s.months[3].actual[not.id] = c(-320); // 420 € vom Notgroschen genommen, 100 € planmäßig eingezahlt
    s.months[3].actual[v('Lebensmittel')] = c(398.75);
    for (var m = 1; m <= 3; m++) s.months[m].closed = true;
    s.meta.demo = true;
    return s;
  }

  var SECTIONS = ['incomes', 'fixed', 'variable', 'savings'];

  function allItems(state) {
    return state.incomes.concat(state.fixed, state.variable, state.savings);
  }

  /* ---------- Monatsberechnung ---------- */

  function sum(arr, f) {
    var t = 0;
    for (var i = 0; i < arr.length; i++) t += f(arr[i]);
    return t;
  }

  function rowFor(state, mo, it, m) {
    var plan = planForMonth(it, m);
    var has = Object.prototype.hasOwnProperty.call(mo.actual, it.id);
    return { id: it.id, name: it.name, plan: plan, actual: has ? mo.actual[it.id] : plan, manual: has };
  }

  function monthCalc(state, m) {
    var mo = state.months[m];
    var exInc = mo.extras.filter(function (x) { return x.type === 'income'; });
    var exExp = mo.extras.filter(function (x) { return x.type === 'expense'; });
    var inc = state.incomes.map(function (i) { return rowFor(state, mo, i, m); });
    var fix = state.fixed.map(function (i) { return rowFor(state, mo, i, m); });
    var vari = state.variable.map(function (i) { return rowFor(state, mo, i, m); });
    var sav = state.savings.map(function (i) { return rowFor(state, mo, i, m); });
    function t(rows, f) { return sum(rows, function (r) { return r[f]; }); }
    var plan = {
      income: t(inc, 'plan'), fixed: t(fix, 'plan'), variable: t(vari, 'plan'), savings: t(sav, 'plan')
    };
    plan.expenses = plan.fixed + plan.variable;
    plan.room = plan.income - plan.expenses - plan.savings;
    var act = {
      income: t(inc, 'actual'), fixed: t(fix, 'actual'), variable: t(vari, 'actual'), savings: t(sav, 'actual')
    };
    act.extraIncome = sum(exInc, function (x) { return x.amount; });
    act.extraExpense = sum(exExp, function (x) { return x.amount; });
    act.income += act.extraIncome;
    act.expenses = act.fixed + act.variable + act.extraExpense;
    // Ein negativer Sparbetrag (Geld vom Sparkonto genommen) erhöht den Spielraum des Monats.
    act.room = act.income - act.expenses - act.savings;
    return { month: m, closed: mo.closed, extraIncome: exInc, extraExpense: exExp, income: inc, fixed: fix, variable: vari, savings: sav, plan: plan, actual: act };
  }

  /* ---------- Jahreswerte ---------- */

  function yearPlan(state) {
    var r = { income: 0, fixed: 0, variable: 0, expenses: 0, savings: 0, room: 0, monthlyRoom: [], monthly: [] };
    for (var m = 1; m <= 12; m++) {
      var c = monthCalc(state, m).plan;
      r.income += c.income; r.fixed += c.fixed; r.variable += c.variable; r.savings += c.savings;
      r.monthlyRoom.push(c.room);
      r.monthly.push(c);
    }
    r.expenses = r.fixed + r.variable;
    r.room = r.income - r.expenses - r.savings;
    return r;
  }

  function confirmedTotals(state) {
    var r = { months: 0, income: 0, expenses: 0, savings: 0, room: 0 };
    for (var m = 1; m <= 12; m++) {
      if (!state.months[m].closed) continue;
      var c = monthCalc(state, m).actual;
      r.months++;
      r.income += c.income; r.expenses += c.expenses; r.savings += c.savings; r.room += c.room;
    }
    return r;
  }

  function percent(part, whole) {
    if (!(whole > 0)) return 0;
    return Math.round(part * 10000 / whole) / 100;
  }

  // Sparstatus eines Bereichs (savId) oder aller Bereiche (savId = null).
  // „saved“ ist netto: Einzahlungen minus Entnahmen (Entnahme = negativer Sparbetrag), nur abgeschlossene Monate.
  function savingsStatus(state, savId) {
    var list = savId ? state.savings.filter(function (s) { return s.id === savId; }) : state.savings;
    var st = { yearGoal: 0, saved: 0, plannedSoFar: 0, deviation: 0, progress: 0, closedMonths: 0 };
    list.forEach(function (s) {
      for (var m = 1; m <= 12; m++) {
        var plan = planForMonth(s, m);
        st.yearGoal += plan;
        var mo = state.months[m];
        if (mo.closed) {
          var actual = Object.prototype.hasOwnProperty.call(mo.actual, s.id) ? mo.actual[s.id] : plan;
          st.saved += actual;
          st.plannedSoFar += plan;
        }
      }
    });
    for (var m2 = 1; m2 <= 12; m2++) if (state.months[m2].closed) st.closedMonths++;
    st.deviation = st.saved - st.plannedSoFar;
    st.progress = st.yearGoal > 0 ? Math.round(st.saved * 10000 / st.yearGoal) / 100 : 0;
    return st;
  }

  /* ---------- Änderungen am Zustand ---------- */

  function setActual(state, m, id, cents) {
    state.months[m].actual[id] = cents;
  }
  function resetActual(state, m, id) {
    delete state.months[m].actual[id];
  }
  function setMonthClosed(state, m, closed) {
    state.months[m].closed = !!closed;
  }
  function addExtra(state, m, type, name) {
    var x = { id: makeId('ext'), type: type === 'income' ? 'income' : 'expense', name: name, amount: 0 };
    state.months[m].extras.push(x);
    return x;
  }
  function removeExtra(state, m, id) {
    state.months[m].extras = state.months[m].extras.filter(function (x) { return x.id !== id; });
  }
  function removeItem(state, section, id) {
    state[section] = state[section].filter(function (i) { return i.id !== id; });

  /* ---------- Bausteine ---------- */
  function tile(kind, label, cents, s1, s2) {
    return '<div class="tile k-' + kind + '"><div class="lbl">' + label + '</div><div class="val' + negCls(cents) + '">' + money(cents) +
      '</div><div class="s1" title="' + esc(s1) + '">' + s1 + '</div><div class="s2" title="' + esc(s2) + '">' + s2 + '</div></div>';
  }
  function minput(key, cents, label, attrs, bad) {
    return '<span class="mi"><input class="inp num" type="text" inputmode="decimal" autocomplete="off" data-k="' + key + '" ' + attrs +
      ' value="' + OFC.formatNumber(cents) + '" aria-label="' + esc(label) + '"><span class="cur">€</span></span>';
  }
  function tinput(key, value, label, attrs) {
    return '<input class="inp name" type="text" maxlength="60" autocomplete="off" data-k="' + key + '" ' + attrs + ' value="' + esc(value) + '" aria-label="' + esc(label) + '">';
  }
  function select(key, options, value, label, attrs) {
    return '<select class="inp" data-k="' + key + '" ' + attrs + ' aria-label="' + esc(label) + '">' + options.map(function (o) {
      return '<option value="' + o[0] + '"' + (String(o[0]) === String(value) ? ' selected' : '') + '>' + esc(o[1]) + '</option>';
    }).join('') + '</select>';
  }
  function rhythmOptions(keys) {
    return OFC.RHYTHMS.filter(function (r) { return !keys || keys.indexOf(r.key) >= 0; }).map(function (r) { return [r.key, r.label]; });
  }
  var MONTH_OPTS = OFC.MONTHS.map(function (n, i) { return [i + 1, n]; });

  function gauge(pct, hasGoal) {
    var cx = 160, cy = 150, r = 110;
    var f = Math.max(0, Math.min(100, pct)) / 100;
    function pt(fr, rad) { var a = Math.PI * fr; return [(cx - rad * Math.cos(a)).toFixed(2), (cy - rad * Math.sin(a)).toFixed(2)]; }
    var p0 = pt(0, r), p1 = pt(f, r), p2 = pt(1, r);
    var s = '<svg class="gauge" viewBox="0 0 320 200" role="img" aria-label="Spar-Tacho: ' + OFC.formatPercent(pct) + ' des Jahresziels erreicht">';
    s += '<path d="M' + p0[0] + ' ' + p0[1] + ' A' + r + ' ' + r + ' 0 0 1 ' + p2[0] + ' ' + p2[1] + '" fill="none" stroke="#E3DFD5" stroke-width="18" stroke-linecap="round"/>';
    if (f > 0) s += '<path d="M' + p0[0] + ' ' + p0[1] + ' A' + r + ' ' + r + ' 0 0 1 ' + p1[0] + ' ' + p1[1] + '" fill="none" stroke="#5E6B5B" stroke-width="18" stroke-linecap="round"/>';
    [0, 25, 50, 75, 100].forEach(function (t) {
      var a = pt(t / 100, r - 17), b = pt(t / 100, r - 26), l = pt(t / 100, r + 22);
      s += '<line x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0] + '" y2="' + b[1] + '" stroke="#7A7A7A" stroke-width="2"/>';
      s += '<text x="' + l[0] + '" y="' + (parseFloat(l[1]) + 4) + '" text-anchor="middle" font-size="11" fill="#7A7A7A">' + t + (t === 0 || t === 100 ? ' %' : '') + '</text>';
    });
    var tip = pt(f, r - 8), tail = pt(f + 1, 14);
    s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + tip[0] + '" y2="' + tip[1] + '" stroke="#2E342C" stroke-width="5" stroke-linecap="round"/>';
    s += '<circle cx="' + cx + '" cy="' + cy + '" r="10" fill="#2E342C"/><circle cx="' + cx + '" cy="' + cy + '" r="4" fill="#F5F3EE"/>';
    s += '<text x="' + cx + '" y="' + (cy + 40) + '" text-anchor="middle" font-size="30" font-weight="700" fill="#2E342C">' + OFC.formatPercent(pct) + '</text>';
    return s + '</svg>';
  }

  function donut(segs, total) {
    var R = 66, C = 2 * Math.PI * R, acc = 0;
    var s = '<svg class="donut" viewBox="0 0 200 200" role="img" aria-label="Budgetverteilung Jahresplan"><circle cx="100" cy="100" r="' + R + '" fill="none" stroke="#E9E6DD" stroke-width="30"/>';
    if (total > 0) {
      segs.forEach(function (g) {
        if (g.value <= 0) return;
        var len = g.value / total * C;
        s += '<circle cx="100" cy="100" r="' + R + '" fill="none" stroke="' + g.color + '" stroke-width="30" stroke-dasharray="' + Math.max(0, len - 1.5).toFixed(2) + ' ' + (C - Math.max(0, len - 1.5)).toFixed(2) + '" stroke-dashoffset="' + (-acc).toFixed(2) + '" transform="rotate(-90 100 100)"/>';
        acc += len;
      });
    }
    s += '<text x="100" y="96" text-anchor="middle" font-size="12" fill="#7A7A7A">Jahresplan</text><text x="100" y="116" text-anchor="middle" font-size="18" font-weight="700" fill="#2E342C">2027</text></svg>';
    return s;
  }

  /* ---------- Seiten ---------- */
  function header() {
    var logo = LOGO_SRC.indexOf('data:') === 0
      ? '<img class="logo" src="' + LOGO_SRC + '" alt="Formel &amp; Faden Studio"><span class="prod">Finanzplaner 2027</span>'
      : '<div><div class="bname">Formel &amp; Faden Studio</div><div class="tag">Finanzplaner 2027</div></div>';
    function a(href, on, n, t) { return '<a href="#/' + href + '" class="' + (on ? 'on' : '') + '"' + (on ? ' aria-current="page"' : '') + '><span class="n">' + n + '</span>' + t + '</a>'; }
    return '<header class="hdr"><div class="wrap"><a class="brand" href="#/dashboard" aria-label="Formel &amp; Faden Studio – zum Dashboard">' + logo + '</a>' +
      '<nav class="nav" aria-label="Hauptnavigation">' + a('dashboard', ui.page === 'dashboard', '01', 'Dashboard') + a('plan', ui.page === 'plan', '02', 'Jahresplanung') + a('monat/' + ui.month, ui.page === 'month', '03', '<span class="lg">Monatsübersichten</span><span class="sh">Monate</span>') + '</nav>' +
      '<button class="bk" data-do="backup" type="button"><span class="lg">Datensicherung</span><span class="sh">Sicherung</span></button></div></header>';
  }

  function banners() {
    var h = '';
    if (loadError) h += '<div class="callout warn" role="alert"><b>Gespeicherte Daten konnten nicht gelesen werden.</b><p>' + esc(loadError) + ' Eine Kopie der unlesbaren Daten wurde im Browser aufbewahrt und nichts wurde gelöscht. Sobald Sie etwas eingeben, wird mit einem neuen leeren Stand gearbeitet. Wenn Sie eine Sicherungsdatei haben, können Sie sie unter „Datensicherung“ einspielen.</p></div>';
    if (!storageOk) h += '<div class="callout warn" role="alert"><b>Speichern im Browser ist nicht möglich.</b><p>Ihre Eingaben bleiben nur erhalten, solange dieses Fenster geöffnet ist. Bitte erstellen Sie regelmäßig eine Sicherung (Schaltfläche „Datensicherung“) oder erlauben Sie Ihrem Browser das Speichern von Website-Daten.</p></div>';
    if (state.meta.demo) h += '<div class="callout"><b>Sie sehen Beispieldaten.</b><p>Alle Zahlen sind erfunden und dienen nur zum Ausprobieren. Sie können alles ändern. Wenn Sie bereit sind, beginnen Sie mit Ihrem eigenen leeren Plan.</p><div class="acts"><button class="btn" data-do="enddemo" type="button">Beispiel beenden und selbst starten</button></div></div>';
    if (!dismissedBanner && hasData() && !state.meta.demo) {
      var lb = state.meta.lastBackup;
      if (!lb || daysSince(lb) > 30) {
        h += '<div class="callout"><b>Bitte sichern Sie Ihre Daten.</b><p>' + (lb ? 'Die letzte Sicherung ist vom ' + dateDe(lb) + '.' : 'Es wurde noch keine Sicherung erstellt.') + ' Ihre Eingaben liegen nur in diesem Browser und gehen bei gelöschten Website-Daten oder einem Browser- oder Gerätewechsel verloren.</p><div class="acts"><button class="btn" data-do="export" type="button">Jetzt Sicherung erstellen</button><button class="btn sec" data-do="dismiss" type="button">Später erinnern</button></div></div>';
      }
    }
    return h;
  }

  function footer() {
    var lb = state.meta.lastBackup;
    return '<footer class="ft"><div class="wrap"><b>Datenschutz:</b> Alle Eingaben werden ausschließlich lokal in diesem Browser gespeichert und nicht an Dritte übertragen. ' +
      '<b>Wichtig:</b> Bei gelöschten Website-Daten, anderem Browser oder anderem Gerät sind die Daten nicht vorhanden – bitte regelmäßig eine Sicherung erstellen. ' +
      'Letzte Sicherung: <b>' + (lb ? dateDe(lb) : 'noch keine') + '</b>. ' + '<button class="lnk" data-do="backup" type="button">Datensicherung öffnen</button></div></footer>';
  }

  function tilesYear() {
    var y = OFC.yearPlan(state);
    var avg = function (c) { return 'Ø ' + money(Math.round(c / 12)) + ' pro Monat'; };
    return '<section class="tiles" aria-label="Kennzahlen Jahresplan 2027">' +
      tile('income', 'Einnahmen', y.income, 'Jahresplan 2027', avg(y.income)) +
      tile('exp', 'Ausgaben', y.expenses, 'Jahresplan 2027', avg(y.expenses)) +
      tile('sav', 'Sparen', y.savings, 'Jahresplan 2027', avg(y.savings)) +
      tile('room', 'Spielraum', y.room, 'Jahresplan 2027', 'nach Ausgaben und Sparen') + '</section>';
  }

  function pageDashboard() {
    var y = OFC.yearPlan(state), ct = OFC.confirmedTotals(state);
    var h = '<div class="pagehead"><h1>Dashboard</h1><div class="slogan">Einmal planen. Monatlich anpassen. Finanzen im Blick behalten.</div></div>';
    if (!hasData()) {
      h += '<div class="callout"><b>Willkommen!</b><p>Tragen Sie zuerst in der Jahresplanung Ihre Einnahmen, Fixkosten, variablen Ausgaben und Sparbeträge ein. Danach sehen Sie hier Ihre Übersicht.</p><div class="acts"><a class="btn" href="#/plan" style="text-decoration:none">Zur Jahresplanung</a><button class="btn sec" type="button" data-do="demo">Beispiel ansehen</button></div></div>';
    }
    h += '<details class="how"><summary>So funktioniert der Finanzplaner</summary><ol>' +
      '<li><b>Jahresplanung:</b> Einmal alle regelmäßigen und unregelmäßigen Beträge eintragen. Sie werden automatisch auf die richtigen Monate verteilt.</li>' +
      '<li><b>Monatsübersichten:</b> „Geplant“ ist Ihr Plan. „Tatsächlich“ ist, was wirklich geflossen ist. Es startet mit dem Planwert, und Sie ändern nur Abweichungen.</li>' +
      '<li><b>Monat abschließen:</b> Erst abgeschlossene Monate zählen als bestätigt und bewegen den Spar-Tacho.</li>' +
      '<li><b>Sichern:</b> Ihre Daten liegen nur in diesem Browser. Erstellen Sie regelmäßig eine Sicherung.</li></ol></details>';
    h += tilesYear();

    // Spar-Tacho
    var area = ui.savArea !== 'all' && state.savings.some(function (s) { return s.id === ui.savArea; }) ? ui.savArea : 'all';
    var st = OFC.savingsStatus(state, area === 'all' ? null : area);
    var chips = '<button type="button" data-do="area" data-id="all" class="' + (area === 'all' ? 'on' : '') + '">Gesamt</button>' + state.savings.map(function (s) {
      return '<button type="button" data-do="area" data-id="' + s.id + '" class="' + (area === s.id ? 'on' : '') + '">' + esc(s.name) + '</button>';
    }).join('');
    var gtxt;
    if (st.yearGoal === 0) gtxt = 'Noch kein Sparbetrag geplant. Tragen Sie in der Jahresplanung einen Betrag ein, z. B. 150 € monatlich.';
    else if (st.closedMonths === 0) gtxt = 'Noch kein Monat abgeschlossen. Der Zeiger bewegt sich, sobald Sie einen Monat abschließen.';
    else gtxt = 'Der Tacho zählt nur abgeschlossene Monate (' + st.closedMonths + ' von 12).';
    var over = st.yearGoal > 0 && st.saved >= st.yearGoal;
    h += '<div class="dash2"><section class="card" aria-label="Spar-Tacho"><div class="cardhead"><h2>Spar-Tacho</h2><span class="sum">bestätigter Fortschritt zum Jahresziel</span></div>' +
      '<div class="areas" role="group" aria-label="Sparbereich wählen">' + chips + '</div>' + gauge(st.progress, st.yearGoal > 0) +
      (over ? '<p class="good" style="text-align:center;margin:0 0 6px"><b>Jahresziel erreicht' + (st.saved > st.yearGoal ? ' – ' + money(st.saved - st.yearGoal) + ' darüber' : '') + '</b></p>' : '') +
      '<div class="gstats"><div>Tatsächlich gespart (netto)<b class="' + (st.saved < 0 ? 'neg' : '') + '">' + money(st.saved) + '</b></div><div>Jahresziel<b>' + money(st.yearGoal) + '</b></div>' +
      '<div>Bisher geplant<b>' + money(st.plannedSoFar) + '</b></div><div>Abweichung zum Plan<b class="' + (st.deviation < 0 ? 'neg' : '') + '">' + signed(st.deviation) + '</b></div>' +
      '</div><p class="hint" style="margin-top:10px">' + gtxt + ' Geld, das Sie vom Sparkonto nehmen, tragen Sie in der Monatsübersicht als Minusbetrag ein. Es senkt den Fortschritt.</p></section>';

    // Budgetverteilung
    var room = Math.max(0, y.room);
    var segs = [{ label: 'Fixkosten', value: y.fixed, color: COLORS.fixed }, { label: 'Variable Ausgaben', value: y.variable, color: COLORS.variable },
      { label: 'Sparen', value: y.savings, color: COLORS.savings }, { label: 'Spielraum', value: room, color: COLORS.room }];
    var tot = segs.reduce(function (a, g) { return a + g.value; }, 0);
    h += '<div class="stack"><section class="card" aria-label="Budgetverteilung"><div class="cardhead"><h2>Budgetverteilung</h2><span class="sum">Jahresplan 2027</span></div>';
    if (tot === 0) h += '<p class="hint">Noch keine Planwerte vorhanden. Sobald Sie in der Jahresplanung Beträge eintragen, sehen Sie hier die Verteilung Ihrer Einnahmen.</p><div class="donutwrap">' + donut(segs, 0) + '</div>';
    else {
      h += '<div class="donutwrap">' + donut(segs, tot) + '<ul class="legend">' + segs.map(function (g) {
        return '<li><i style="background:' + g.color + '"></i><span>' + g.label + '</span><span class="v">' + money(g.value) + '</span><span class="p">' + OFC.formatPercent(Math.round(g.value * 1000 / tot) / 10).replace(/(\d+),(\d)0/, '$1,$2') + ' des Gesamtbetrags</span></li>';
      }).join('') + '</ul></div>';
      if (y.room < 0) h += '<p class="hint neg" style="margin-top:10px">Achtung: Die geplanten Ausgaben und Sparbeträge übersteigen die Einnahmen um ' + money(-y.room) + '.</p>';
    }
    h += '</section>';

    // Bestätigte Monate
    h += '<section class="card" aria-label="Monatsabschlüsse"><div class="cardhead"><h2>Bestätigte Monate</h2><span class="sum"><b>' + ct.months + ' von 12</b> abgeschlossen</span></div>';
    if (ct.months === 0) h += '<p class="hint">Noch kein Monat abgeschlossen. Die Kacheln oben zeigen den vollständigen Jahresplan. Bestätigte Werte entstehen erst, wenn Sie in einer Monatsübersicht auf „Monat abschließen“ klicken.</p>';
    else h += '<p class="hint">Bestätigte Ist-Werte der abgeschlossenen Monate: Einnahmen <b>' + money(ct.income) + '</b> · Ausgaben <b>' + money(ct.expenses) + '</b> · Sparen <b>' + money(ct.savings) + '</b> · Spielraum <b class="' + (ct.room < 0 ? 'neg' : '') + '">' + money(ct.room) + '</b></p>';
    h += '<div class="mpills">' + OFC.MONTHS.map(function (n, i) {
      var c = state.months[i + 1].closed;
      return '<a class="mp' + (c ? ' done' : '') + '" href="#/monat/' + (i + 1) + '">' + SHORT[i] + '<small>' + (c ? 'abgeschlossen' : 'offen') + '</small></a>';
    }).join('') + '</div></section></div></div>';
    // Spielraum je Monat
    var actRoom = [];
    for (var cm = 1; cm <= 12; cm++) actRoom.push(state.months[cm].closed ? OFC.monthCalc(state, cm).actual.room : null);
    ui.chart = { plan: y.monthlyRoom, actual: actRoom };
    h += '<section class="card" aria-label="Monatlicher Spielraum"><div class="cardhead"><h2>Spielraum je Monat</h2><span class="sum">Einnahmen − Ausgaben − Sparen</span></div><div class="legend2"><span><i style="background:#AEB9A6"></i>Geplant</span><span><i style="background:#5E6B5B"></i>Tatsächlich (abgeschlossene Monate)</span><span><i style="background:#9B4A3C"></i>Defizit</span></div><div class="chart" id="spaceChart" data-nomorph="1"></div></section>';

    return h;
  }

  function posBlock(sec, it) {
    var key = sec + ':' + it.id;
    var name = '<div class="pos-head">' + tinput(key + ':name', it.name, 'Bezeichnung', 'data-act="name" data-sec="' + sec + '" data-id="' + it.id + '"') +
      '<span class="pos-year">Jahr: <b>' + money(OFC.planForYear(it)) + '</b></span>' +
      '<button class="icon-btn" type="button" data-do="del" data-sec="' + sec + '" data-id="' + it.id + '" aria-label="Position „' + esc(it.name) + '“ entfernen" title="Entfernen">×</button></div>';
    var rk = sec === 'savings' ? OFC.SAVING_RHYTHMS : null;
    var amtLabel = sec === 'savings' ? 'Sparbetrag je Rhythmus' : 'Betrag je Zahlung';
    var fields = '<div class="fld"><label>' + amtLabel + '</label>' + minput(key + ':amount', it.amount, it.name + ': ' + amtLabel, 'data-act="amount" data-sec="' + sec + '" data-id="' + it.id + '"') + '</div>' +
      '<div class="fld"><label>Rhythmus</label>' + select(key + ':rhythm', rhythmOptions(rk), it.rhythm, it.name + ': Zahlungsrhythmus', 'data-act="rhythm" data-sec="' + sec + '" data-id="' + it.id + '"') + '</div>' +
      '<div class="fld"><label>' + (sec === 'savings' ? 'Erster Sparmonat' : 'Erster Zahlungsmonat') + '</label>' + select(key + ':start', MONTH_OPTS, it.startMonth, it.name + ': erster Monat', 'data-act="start" data-sec="' + sec + '" data-id="' + it.id + '"') + '</div>';
    return '<div class="pos">' + name + '<div class="pos-fields">' + fields + '</div></div>';
  }
  function varRow(it) {
    var key = 'variable:' + it.id;
    return '<div class="row-v">' + tinput(key + ':name', it.name, 'Bezeichnung', 'data-act="name" data-sec="variable" data-id="' + it.id + '"') +
      minput(key + ':amount', it.amount, it.name + ': Monatsbudget', 'data-act="amount" data-sec="variable" data-id="' + it.id + '"') +
      '<span class="pos-year">Jahr: <b>' + money(OFC.planForYear(it)) + '</b></span>' +
      '<button class="icon-btn" type="button" data-do="del" data-sec="variable" data-id="' + it.id + '" aria-label="Kategorie „' + esc(it.name) + '“ entfernen" title="Entfernen">×</button></div>';
  }
  function sumOf(list) { return list.reduce(function (a, i) { return a + OFC.planForYear(i); }, 0); }

  function pagePlan() {
    var y = OFC.yearPlan(state);
    var h = '<div class="pagehead"><h1>Jahresplanung 2027</h1><p>Hier planen Sie einmal. Die Beträge werden automatisch auf die Monate verteilt. In den Monatsübersichten ändern Sie nur noch Abweichungen.</p></div>' + tilesYear();
    h += '<div class="grid2">';
    h += '<section class="card" aria-label="Einnahmen"><div class="cardhead"><h2>Einnahmen</h2><span class="sum">Jahressumme <b>' + money(y.income) + '</b></span></div><p class="hint">Die beiden „Weiteren Einnahmen“ können Sie umbenennen, z. B. in Kindergeld oder Nebenjob.</p>' +
      state.incomes.map(function (i) { return posBlock('incomes', i); }).join('') +
      '<button class="btn add" type="button" data-do="add" data-sec="incomes">+ Einnahme hinzufügen</button></section>';
    h += '<section class="card" aria-label="Rücklagen und Sparziele"><div class="cardhead"><h2>Rücklagen &amp; Sparziele</h2><span class="sum">Jahresziel gesamt <b>' + money(y.savings) + '</b></span></div><p class="hint">Geben Sie einfach ein, was Sie zur Seite legen möchten. Beispiel: 150 € monatlich ergibt ein Jahresziel von 1.800 €.</p>' +
      state.savings.map(function (i) { return posBlock('savings', i); }).join('') +
      '<button class="btn add" type="button" data-do="add" data-sec="savings">+ Sparbereich hinzufügen</button></section></div>';
    h += '<section class="expenses gap" aria-label="Ausgaben"><div class="cardhead"><h2>Ausgaben</h2><span class="sum">Jahressumme <b>' + money(y.expenses) + '</b></span></div><p class="hint">Fixkosten kommen regelmäßig, variable Ausgaben planen Sie als Monatsbudget. Heizung, Gas und Wasser sind meist in den Nebenkosten enthalten, bitte nicht doppelt eintragen.</p><div class="grid2">' +
      '<div class="card"><div class="cardhead"><h3>Fixkosten</h3><span class="sum">Jahr <b>' + money(y.fixed) + '</b></span></div>' + state.fixed.map(function (i) { return posBlock('fixed', i); }).join('') +
      '<button class="btn add" type="button" data-do="add" data-sec="fixed">+ Fixkosten hinzufügen</button></div>' +
      '<div class="card"><div class="cardhead"><h3>Variable Ausgaben</h3><span class="sum">Jahr <b>' + money(y.variable) + '</b></span></div><p class="hint">Monatsbudget je Kategorie. Nicht benötigte Kategorien lassen Sie bei 0 €.</p>' + state.variable.map(varRow).join('') +
      '<button class="btn add" type="button" data-do="add" data-sec="variable">+ Kategorie hinzufügen</button></div></div></section>';
    return h;
  }

  function mrow(m, r, closed, extra) {
    return '<div class="mrow"><div class="nm">' + esc(r.name) + (r.manual ? ' <span class="mark" title="Manuell angepasst">angepasst</span>' : '') + '</div><div class="pl">' + money(r.plan) + '</div><div class="ac">' +
      minput('act:' + m + ':' + r.id, r.actual, r.name + ' tatsächlich im ' + OFC.MONTHS[m - 1], 'data-act="actual" data-m="' + m + '" data-id="' + r.id + '"' + (closed ? ' disabled' : '')) + '</div><div class="rs">' +
      (r.manual && !closed ? '<button class="lnk" type="button" data-do="reset" data-m="' + m + '" data-id="' + r.id + '" title="Auf Planwert zurücksetzen" aria-label="' + esc(r.name) + ': Auf Planwert zurücksetzen">↺ Plan</button>' : '') + '</div></div>' + (extra || '');
  }
  function xrow(m, x, closed) {
    return '<div class="mrow"><div class="nm">' + tinput('x:' + x.id + ':name', x.name, 'Bezeichnung der Zusatzposition', 'data-act="xname" data-m="' + m + '" data-id="' + x.id + '"' + (closed ? ' disabled' : '')) + '</div><div class="pl">–</div><div class="ac">' +
      minput('x:' + x.id + ':amt', x.amount, x.name + ' im ' + OFC.MONTHS[m - 1], 'data-act="xamt" data-m="' + m + '" data-id="' + x.id + '"' + (closed ? ' disabled' : '')) + '</div><div class="rs">' +
      (closed ? '' : '<button class="icon-btn" type="button" data-do="xdel" data-m="' + m + '" data-id="' + x.id + '" aria-label="' + esc(x.name) + ' entfernen" title="Entfernen">×</button>') + '</div></div>';

  function xexp(m, x, closed) {

  function render() {

  var pending = false;

  /* ---------- Minimales DOM-Abgleichen, damit Fokus und Klicks beim Neuzeichnen erhalten bleiben ---------- */
  function morphChildren(o, n) {
    var nArr = Array.prototype.slice.call(n.childNodes);
    for (var i = 0; i < nArr.length; i++) {
      var oc = o.childNodes[i];
      if (!oc) { o.appendChild(nArr[i]); continue; }
      morphNode(o, oc, nArr[i]);
    }

  function morphNode(parent, a, b) {
    if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName) { parent.replaceChild(b, a); return; }
    if (a.nodeType === 3 || a.nodeType === 8) { if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue; return; }
    var i, attrs = a.attributes;
    for (i = attrs.length - 1; i >= 0; i--) {
      var nm = attrs[i].name;
      if (nm === 'open' && a.nodeName === 'DETAILS') continue;

    for (i = 0; i < b.attributes.length; i++) {
      var bn = b.attributes[i].name, bv = b.attributes[i].value;
      if (bn === 'open' && a.nodeName === 'DETAILS') continue;

    if (a.hasAttribute('data-nomorph')) return;
    morphChildren(a, b);
    if (a.nodeName === 'INPUT') { if (!(a === document.activeElement && a._dirty) && a.value !== b.getAttribute('value')) a.value = b.getAttribute('value') || ''; a.classList.remove('bad'); }
    else if (a.nodeName === 'SELECT') { if (a.value !== b.value) a.value = b.value; }
  }

  /* ---------- Diagramm: Spielraum je Monat ---------- */
  function niceTicks(min, max) {
    if (max - min < 1) { max = min + 100; }
    var step = Math.pow(10, Math.floor(Math.log10((max - min) / 4)));
    var n = (max - min) / 4 / step;
    step *= n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10;
    var lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, t = [];
    for (var v = lo; v <= hi + step / 2; v += step) t.push(Math.round(v * 100) / 100);
    return t;
  }
  function fmtE(e) { var s = String(Math.abs(Math.round(e))).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); return (e < 0 && Math.round(e) !== 0 ? '−' : '') + s + ' €'; }
  function drawCharts() {
    var el = document.getElementById('spaceChart');
    if (!el || !ui.chart) return;
    var w = Math.max(280, el.clientWidth || 600), hgt = w < 520 ? 250 : 310;
    var plan = ui.chart.plan.map(function (c) { return c / 100; });
    var act = ui.chart.actual.map(function (c) { return c === null ? null : c / 100; });
    var all = plan.concat(act.filter(function (v) { return v !== null; }));
    var mn = Math.min.apply(null, all.concat([0])), mx = Math.max.apply(null, all.concat([0]));
    var ticks = niceTicks(mn, mx), lo = ticks[0], hi = ticks[ticks.length - 1];
    var ml = 12 + Math.max.apply(null, ticks.map(function (t) { return fmtE(t).length; })) * 7, mr = 8, mt = 22, mb = 28;
    var pw = w - ml - mr, ph = hgt - mt - mb, bw = pw / 12;
    function y(v) { return mt + (hi - v) / (hi - lo) * ph; }
    var s = '<svg viewBox="0 0 ' + w + ' ' + hgt + '" width="' + w + '" height="' + hgt + '" role="img" aria-label="Spielraum je Monat 2027, geplant und tatsächlich">';
    ticks.forEach(function (t) {
      s += '<line x1="' + ml + '" x2="' + (w - mr) + '" y1="' + y(t).toFixed(1) + '" y2="' + y(t).toFixed(1) + '" stroke="' + (t === 0 ? '#7A7A7A' : '#E3DFD5') + '" stroke-width="' + (t === 0 ? 1.5 : 1) + '"/>';
      s += '<text x="' + (ml - 8) + '" y="' + (y(t) + 4).toFixed(1) + '" text-anchor="end" font-size="11" fill="#7A7A7A">' + fmtE(t) + '</text>';
    });
    var bwid = Math.min(24, bw * 0.38), gap = 2;
    function bar(x, v, color, tip) {
      var y0 = y(0), y1 = y(v), top = Math.min(y0, y1), hh = Math.max(Math.abs(y1 - y0), v === 0 ? 0 : 1);
      return v === 0 ? '' : '<rect x="' + x.toFixed(1) + '" y="' + top.toFixed(1) + '" width="' + bwid.toFixed(1) + '" height="' + hh.toFixed(1) + '" rx="3" fill="' + color + '"><title>' + tip + '</title></rect>';
    }
    plan.forEach(function (v, i) {
      var cx = ml + i * bw + bw / 2, a = act[i];
      s += bar(cx - bwid - gap / 2, v, v < 0 ? '#D7B4AA' : '#AEB9A6', OFC.MONTHS[i] + ' geplant: ' + OFC.formatMoney(ui.chart.plan[i]));
      if (a !== null) {
        s += bar(cx + gap / 2, a, a < 0 ? '#9B4A3C' : '#5E6B5B', OFC.MONTHS[i] + ' tatsächlich: ' + OFC.formatMoney(ui.chart.actual[i]));
        if (bw >= 62) s += '<text x="' + (cx + gap / 2 + bwid / 2).toFixed(1) + '" y="' + (a < 0 ? y(a) + 13 : y(a) - 4).toFixed(1) + '" text-anchor="middle" font-size="10" fill="#2E342C">' + fmtE(a) + '</text>';
      }
      s += '<text x="' + cx.toFixed(1) + '" y="' + (hgt - 8) + '" text-anchor="middle" font-size="12" fill="#7A7A7A">' + (bw >= 30 ? SHORT[i] : OFC.MONTHS[i].charAt(0)) + '</text>';
    });
    el.innerHTML = s + '</svg>';
  }
  var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(drawCharts, 120); });

  function toast(msg, kind) {

  function openBackup() {
    var lb = state.meta.lastBackup, prev = null;
    try { prev = localStorage.getItem(LS_PREV); } catch (e) { /* ignorieren */ }
    openModal('<h2>Datensicherung</h2><p>Ihre Daten liegen nur in diesem Browser. Sie gehen verloren, wenn Sie die Website-Daten löschen, den Browser oder das Gerät wechseln oder die Datei an einen anderen Ort verschieben. Bitte öffnen Sie den Finanzplaner immer aus derselben Datei und sichern Sie regelmäßig.</p><p>Letzte Sicherung: <b>' + (lb ? dateDe(lb) : 'noch keine') + '</b></p>' +
      '<div class="opt"><h3>Sicherung erstellen</h3><p>Speichert alle Ihre Daten als Datei (JSON) auf Ihrem Gerät.</p><button class="btn" type="button" data-m="export">Sicherung herunterladen</button></div>' +
      '<div class="opt"><h3>Sicherung einspielen</h3><p>Ersetzt Ihre aktuellen Daten durch den Stand aus einer Sicherungsdatei. Vorher werden Sie um Bestätigung gebeten.</p><input class="sr" id="impfile" type="file" accept=".json,application/json"><label for="impfile" class="btn sec" style="display:inline-block" tabindex="0" id="implabel">Sicherungsdatei wählen</label><div id="impmsg" role="alert"></div></div>' +
      (prev ? '<div class="opt"><h3>Vorherigen Stand wiederherstellen</h3><p>Stellt den Stand vor dem letzten Einspielen einer Sicherung wieder her.</p><button class="btn sec" type="button" data-m="restore">Vorherigen Stand wiederherstellen</button></div>' : '') +
      '<div class="btns"><button class="btn sec" type="button" data-m="close">Schließen</button></div>');
    var m = document.getElementById('modal');

  }
  function doExport() {

    save();
    var payload = OFC.exportPayload(state, now.toISOString());
    var blob = new Blob([JSON.stringify(payload, null, 1)], { type: 'application/json' });
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = 'Finanzplaner2027_Sicherung_' + todayStr() + '.json';
    document.body.appendChild(a); a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);

  }
  function importFile(file, input) {
    var msg = document.getElementById('impmsg');
    function fail(t) { msg.innerHTML = '<div class="err"><b>Import nicht möglich.</b> ' + esc(t) + ' Ihre vorhandenen Daten wurden nicht verändert.</div>'; if (input) input.value = ''; }
    if (file.size > 5 * 1024 * 1024) { fail('Die Datei ist zu groß für eine Sicherung.'); return; }
    var fr = new FileReader();

    fr.onload = function () {
      var r = OFC.parseBackup(String(fr.result));

  }
  function restorePrev() {
    var raw = null; try { raw = localStorage.getItem(LS_PREV); } catch (e) { /* ignorieren */ }

  function readMoney(t, allowNegative) {

  function findItem(sec, id) { return state[sec].filter(function (i) { return i.id === id; })[0]; }

  root.addEventListener('change', function (e) {
    var t = e.target, act = t.getAttribute('data-act');
    if (!act) return;
    t._dirty = false;
    var sec = t.getAttribute('data-sec'), id = t.getAttribute('data-id'), m = parseInt(t.getAttribute('data-m'), 10), it = sec ? findItem(sec, id) : null, v;
    if (act === 'name') {
      var nm = t.value.trim();
      if (!nm) toast('Bitte eine Bezeichnung eingeben.', 'warn'); else if (it) it.name = nm.slice(0, 60);
    } else if (act === 'amount') {
      v = readMoney(t);
      if (v !== null && it) it[act] = v;
    } else if (act === 'xname' || act === 'xamt') {
      var ex = state.months[m].extras.filter(function (x) { return x.id === id; })[0];
      if (act === 'xname') { var xn = t.value.trim(); if (!xn) toast('Bitte eine Bezeichnung eingeben.', 'warn'); else if (ex && !state.months[m].closed) ex.name = xn.slice(0, 60); }
      else { v = readMoney(t); if (v !== null && ex && !state.months[m].closed) ex.amount = v; }
    } else if (act === 'rhythm') { if (it && OFC.rhythmInfo(t.value)) it.rhythm = t.value; }
    else if (act === 'start') { if (it) it.startMonth = parseInt(t.value, 10); }
    else if (act === 'actual') {
      var isSav = state.savings.some(function (x) { return x.id === id; });
      v = readMoney(t, isSav);
      if (v !== null && !state.months[m].closed) OFC.setActual(state, m, id, v);
    }
    save(); requestRender();
  });

  root.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-do]') : null;
    if (!b) return;
    var d = b.getAttribute('data-do'), sec = b.getAttribute('data-sec'), id = b.getAttribute('data-id'), m = parseInt(b.getAttribute('data-m'), 10);
    if (d === 'backup') openBackup();
    else if (d === 'export') doExport();
    else if (d === 'dismiss') { dismissedBanner = true; render(); }
    else if (d === 'area') { ui.savArea = id; render(); }
    else if (d === 'demo') startDemo();
    else if (d === 'enddemo') endDemo();
    else if (d === 'close') {
      OFC.setMonthClosed(state, ui.month, true); save(); render(); toast(OFC.MONTHS[ui.month - 1] + ' 2027 wurde abgeschlossen.');
      var lbk = state.meta.lastBackup;
      if (!state.meta.demo && (!lbk || daysSince(lbk) > 7)) {
        askConfirm('Monat abgeschlossen', 'Möchten Sie jetzt eine Sicherung Ihrer Daten erstellen? Das dauert nur einen Moment und schützt Sie vor Datenverlust.', 'Sicherung erstellen', false, 'Später').then(function (ok) { if (ok) doExport(); });
      }
    }
    else if (d === 'reopen') { OFC.setMonthClosed(state, ui.month, false); save(); render(); toast(OFC.MONTHS[ui.month - 1] + ' 2027 wurde wieder geöffnet. Die Werte sind jetzt vorläufig.'); }
    else if (d === 'negate') {
      var curv = OFC.monthCalc(state, m).savings.filter(function (r) { return r.id === id; })[0].actual;
      OFC.setActual(state, m, id, -curv); save(); render();
    }
    else if (d === 'reset') { OFC.resetActual(state, m, id); save(); render(); toast('Auf Planwert zurückgesetzt.'); }
    else if (d === 'xadd') {
      var typ = b.getAttribute('data-type'), nx = OFC.addExtra(state, ui.month, typ, typ === 'income' ? 'Einmalige Einnahme' : 'Einmalige Ausgabe');
      save(); ui.focusKey = 'x:' + nx.id + ':name'; render();
    } else if (d === 'xdel') { OFC.removeExtra(state, m, id); save(); render(); toast('Position entfernt.'); }
    else if (d === 'add') {
      var label = { incomes: 'Neue Einnahme', fixed: 'Neue Fixkosten', variable: 'Neue Kategorie', savings: 'Neuer Sparbereich' }[sec];
      var it = OFC.addItem(state, sec, label); save(); ui.focusKey = sec + ':' + it.id + ':name'; render();
    } else if (d === 'del') {
      var item = findItem(sec, id);
      askConfirm('Position entfernen?', '„' + esc(item.name) + '“ wird entfernt. Alle dafür erfassten Monatswerte gehen dabei verloren.', 'Entfernen', true).then(function (ok) {
        if (ok) { OFC.removeItem(state, sec, id); save(); render(); toast('Position entfernt.'); }
      });
    }
  });

  function go(h) {
    var p = String(h || '').replace(/^#\/?/, '').split('/');
    if (p[0] === 'plan') ui.page = 'plan';
    else if (p[0] === 'monat') { ui.page = 'month'; var mm = parseInt(p[1], 10); ui.month = mm >= 1 && mm <= 12 ? mm : ui.month; }
    else ui.page = 'dashboard';
    render(); try { window.scrollTo(0, 0); } catch (e) { /* ignorieren */ }
  }
  function startDemo() {
    function run() {
      if (!state.meta.demo) { try { localStorage.setItem(LS_DEMOBACK, JSON.stringify(state)); } catch (e) { /* ignorieren */ } }
      state = OFC.demoState(); save(); closeWelcome(); go('#/dashboard'); toast('Beispieldaten geladen.');
    }
    if (hasData() && !state.meta.demo) {
      askConfirm('Beispieldaten laden?', 'Ihre aktuellen Eingaben werden dafür vorübergehend ersetzt. Beim Beenden des Beispiels bekommen Sie sie zurück.', 'Beispiel laden', false).then(function (ok) { if (ok) run(); });
    } else run();
  }
  function endDemo() {
    askConfirm('Beispiel beenden?', 'Die Beispieldaten werden entfernt. Falls Sie vorher eigene Daten hatten, werden diese wiederhergestellt, sonst beginnen Sie mit einem leeren Plan.', 'Beispiel beenden', true).then(function (ok) {
      if (!ok) return;
      var back = null;
      try { var raw = localStorage.getItem(LS_DEMOBACK); if (raw) { var v = OFC.validateState(JSON.parse(raw)); if (v.ok) back = v.state; } } catch (e) { /* ignorieren */ }
      state = back || OFC.defaultState();
      try { localStorage.removeItem(LS_DEMOBACK); } catch (e) { /* ignorieren */ }
      save(); go('#/plan'); toast(back ? 'Ihre früheren Daten sind wieder da.' : 'Sie starten mit einem leeren Plan.');
    });
  }
  function closeWelcome() {
    try { localStorage.setItem(LS_WELCOME, '1'); } catch (e) { /* ignorieren */ }
    var m = document.getElementById('modal'); if (m.getAttribute('data-welcome')) { m.removeAttribute('data-welcome'); closeModal(); }
  }
  function maybeWelcome() {
    var seen = false; try { seen = !!localStorage.getItem(LS_WELCOME); } catch (e) { /* ignorieren */ }
    if (seen || hasData() || loadError) return;
    openModal('<h2>Willkommen im Finanzplaner 2027</h2><p><b>1. Einmal planen:</b> Tragen Sie in der Jahresplanung Einnahmen, Fixkosten, Ausgaben und Sparbeträge ein.</p><p><b>2. Monatlich anpassen:</b> Der Plan wird in jeden Monat übernommen. Sie ändern nur, was abweicht, und schließen den Monat ab.</p><p><b>3. Daten sichern:</b> Ihre Eingaben bleiben nur in diesem Browser gespeichert. Bitte erstellen Sie regelmäßig eine Sicherung.</p><div class="btns"><button class="btn sec" type="button" data-m="demo">Beispiel ansehen</button><button class="btn" type="button" data-m="start">Los geht’s</button></div>');
    var m = document.getElementById('modal'); m.setAttribute('data-welcome', '1');
    m.onclick = function (e) {
      var t = e.target.closest ? e.target.closest('[data-m]') : null; if (!t) return;
      var a = t.getAttribute('data-m');
      if (a === 'demo') startDemo(); else { closeWelcome(); go('#/plan'); }
    };
  }
  function route() { go(location.hash); }
  document.addEventListener('click', function (e) {
    var a = e.target.closest ? e.target.closest('a[href^="#/"]') : null;
    if (!a) return;
    e.preventDefault();
    var h = a.getAttribute('href');
    go(h);
    try { history.replaceState(null, '', h); } catch (err) { /* in Vorschau-Fenstern nicht möglich */ }
  });
  window.addEventListener('hashchange', route);
  window.addEventListener('storage', function (e) { if (e.key === LS_KEY && document.visibilityState === 'visible' && e.newValue) { try { var v = OFC.validateState(JSON.parse(e.newValue)); if (v.ok) { state = v.state; render(); } } catch (err) { /* ignorieren */ } } });

  try { localStorage.setItem('ofkp2027_probe', '1'); localStorage.removeItem('ofkp2027_probe'); } catch (e) { storageOk = false; }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* ignorieren */ }
  try { if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js'); } catch (e) { /* ignorieren */ }
  window.FPApp = { getState: function () { return state; } };
  route();
  maybeWelcome();
})();

</script>
</body>
</html>
